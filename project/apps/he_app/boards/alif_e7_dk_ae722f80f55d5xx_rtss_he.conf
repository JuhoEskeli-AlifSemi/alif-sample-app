#######################################################
# Select the appropriate Wi-Fi/Bluetooth module support
# 1LV or 1YN
#######################################################
# Murata 1LV Wi-Fi/Bluetooth module support
# CONFIG_CYW43012=y
# CONFIG_CYW43012_MURATA_1LV=y

# Murata 1YN Wi-Fi/Bluetooth module support
CONFIG_CYW43439=y
CONFIG_CYW43439_MURATA_1YN=y
#######################################################
#######################################################

CONFIG_SDIO_STACK=y

CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_SHELL=y
CONFIG_NETWORKING=y

CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_WIFI_AIROC=y

# CONFIG_WIFI_LOG_LEVEL_DBG=y
CONFIG_SDHC_LOG_LEVEL_DBG=y

# Network Stack Configuration
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Network Buffers
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_MAX_CONTEXTS=10

# Stack Sizes
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# Network Management
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# WiFi Interface Configuration
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Increase system workqueue for WiFi initialization
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Network native support
CONFIG_NET_NATIVE=y

# Increase WiFi event task stack
CONFIG_AIROC_WIFI_EVENT_TASK_STACK_SIZE=8192