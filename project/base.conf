# C++ options
CONFIG_COMMON_LIBC_MALLOC=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Logging options
CONFIG_ASSERT=y
CONFIG_LOG=y

#### debug section ####
CONFIG_DEBUG=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_PRINTK=y

# Multi-core GPIO support
CONFIG_IPM=y
CONFIG_ALIF_HWSEM=y
CONFIG_GPIO_DW_MULTICORE=y

